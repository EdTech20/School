<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Staff Appraisal System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../Style&Functions/styles.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <i class="bi bi-mortarboard-fill"></i>
            <h2>Staff Appraisal</h2>
            <p>Password Recovery</p>
        </div>

        <div id="authAlert" class="alert alert-danger hidden">
            <i class="bi bi-exclamation-triangle"></i>
            <span></span>
        </div>

        <!-- STEP 1: Enter Email -->
        <div class="auth-form" id="step1">
            <p class="text-gray mb-3 text-center">Enter your email to receive a One-Time Password (OTP).</p>
            <div class="form-group">
                <label for="forgotEmail">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control" id="forgotEmail" placeholder="Enter your email" required>
                </div>
            </div>
            <button type="button" class="auth-btn" id="sendOtpBtn">
                <i class="bi bi-send"></i> Send OTP
            </button>
            <p class="auth-footer mt-3 text-center">
                <a href="../index.html"><i class="bi bi-arrow-left"></i> Back to Login</a>
            </p>
        </div>

        <!-- STEP 2: Enter OTP -->
        <div class="auth-form hidden" id="step2">
            <p class="text-gray mb-3 text-center">An OTP has been sent to <strong id="otpEmailDisplay"></strong>. Enter it below.</p>
            <div class="form-group">
                <label for="otpInput">One-Time Password (OTP)</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                    <input type="text" class="form-control" id="otpInput" placeholder="Enter 6-digit OTP" maxlength="6" required>
                </div>
            </div>
            <button type="button" class="auth-btn" id="verifyOtpBtn">
                <i class="bi bi-check-circle"></i> Verify OTP
            </button>
            <p class="auth-footer mt-3 text-center">
                <a href="#" id="resendOtpLink"><i class="bi bi-arrow-clockwise"></i> Resend OTP</a>
                <br>
                <a href="../index.html" class="mt-2 d-inline-block"><i class="bi bi-arrow-left"></i> Back to Login</a>
            </p>
        </div>

        <!-- STEP 3: Reset Password -->
        <div class="auth-form hidden" id="step3">
            <p class="text-gray mb-3 text-center">OTP verified! Create your new password.</p>
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="newPassword" placeholder="Enter new password" required>
                    <span class="input-group-text password-toggle" id="toggleNewPassword">
                        <i class="bi bi-eye"></i>
                    </span>
                </div>
            </div>
            <div class="form-group">
                <label for="confirmNewPassword">Confirm Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" class="form-control" id="confirmNewPassword" placeholder="Confirm new password" required>
                </div>
            </div>
            <button type="button" class="auth-btn" id="resetPasswordBtn">
                <i class="bi bi-check-lg"></i> Reset Password
            </button>
            <p class="auth-footer mt-3 text-center">
                <a href="../index.html"><i class="bi bi-arrow-left"></i> Back to Login</a>
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script src="../Style&Functions/api.js"></script>
    <script src="../Style&Functions/App.js"></script>
    <script src="auth.js"></script>
</body>
</html>
