<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sign Up - Staff Appraisal System</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"><link rel="stylesheet" href="../Style&Functions/styles.css"></head><body class="auth-page">
<div class="auth-card signup-card"><div class="auth-logo"><i class="bi bi-mortarboard-fill"></i><h2>Staff Appraisal</h2><p>Create your account</p></div><div id="authAlert" class="alert alert-danger hidden"><i class="bi bi-exclamation-triangle"></i><span></span></div>
<form class="auth-form" id="signupForm">
<div class="form-group text-center signup-photo"><label class="profile-upload-label" for="profileImage"><div class="profile-upload-circle"><i class="bi bi-person-circle profile-upload-icon"></i><img id="profilePreview" class="profile-upload-preview hidden" alt="Preview"></div><span class="profile-upload-text">Add Profile Photo</span></label><input type="file" id="profileImage" accept="image/*" class="hidden"></div>
<div class="signup-grid">
<div class="form-group"><label for="signupName">Full Name</label><div class="input-group"><span class="input-group-text"><i class="bi bi-person"></i></span><input type="text" class="form-control" id="signupName" placeholder="Enter full name" required></div></div>
<div class="form-group"><label for="signupEmail">Email Address</label><div class="input-group"><span class="input-group-text"><i class="bi bi-envelope"></i></span><input type="email" class="form-control" id="signupEmail" placeholder="Enter email" required></div></div>
<div class="form-group" id="matricNumberGroup"><label for="signupStaffId">Matric Number <small class="text-muted">(Students Only)</small></label><div class="input-group"><span class="input-group-text"><i class="bi bi-card-text"></i></span><input type="text" class="form-control" id="signupStaffId" placeholder="Enter matric number"></div></div>
<div class="form-group"><label for="signupDepartment">Department</label><div class="input-group"><span class="input-group-text"><i class="bi bi-building"></i></span><select class="form-control form-select" id="signupDepartment" required><option value="">Select Department</option></select></div></div>
<div class="form-group"><label for="signupRole">Role</label><div class="input-group"><span class="input-group-text"><i class="bi bi-shield"></i></span><select class="form-control form-select" id="signupRole" required><option value="">Select Role</option><option value="Lecturer">Lecturer</option><option value="Student">Student</option></select></div><div class="form-text text-muted mt-1 signup-info"><i class="bi bi-info-circle"></i> HODs are appointed by the VC. Register as Lecturer or Student.</div></div>
<div class="form-group"><label for="signupPassword">Password</label><div class="input-group"><span class="input-group-text"><i class="bi bi-lock"></i></span><input type="password" class="form-control" id="signupPassword" placeholder="Create password" required><span class="input-group-text password-toggle" id="toggleSignupPassword"><i class="bi bi-eye"></i></span></div></div>
<div class="form-group"><label for="signupConfirmPassword">Confirm Password</label><div class="input-group"><span class="input-group-text"><i class="bi bi-lock-fill"></i></span><input type="password" class="form-control" id="signupConfirmPassword" placeholder="Confirm password" required></div></div>
</div>
<button type="submit" class="auth-btn">Create Account</button></form><div class="auth-footer"><p>Already have an account? <a href="../index.html">Sign In</a></p></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script><script src="../Style&Functions/api.js"></script><script src="../Style&Functions/App.js"></script><script src="auth.js"></script></body></html>
