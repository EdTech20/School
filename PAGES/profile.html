<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Staff Appraisal System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../Style&Functions/styles.css">
</head>
<body>
    <div class="main-content">
        <div class="content-wrapper">
            <div class="card">
                <div class="profile-header">
                    <div class="profile-avatar" id="profileAvatar">
                        <i class="bi bi-person-fill"></i>
                    </div>
                    <div class="profile-info">
                        <h2 id="profileName">Loading...</h2>
                        <p id="profileRole">Loading...</p>
                    </div>
                </div>
                <div class="profile-body">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="profile-field">
                                <label>System ID</label>
                                <span id="profileSystemId">-</span>
                            </div>
                            <div class="profile-field">
                                <label>School Staff ID</label>
                                <span id="profileStaffId">-</span>
                            </div>
                            <div class="profile-field">
                                <label>Email</label>
                                <span id="profileEmail">-</span>
                            </div>
                            <div class="profile-field">
                                <label>Department</label>
                                <span id="profileDepartment">-</span>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="profile-field">
                                <label>Role</label>
                                <span id="profileRoleBadge">-</span>
                            </div>
                            <div class="profile-field">
                                <label>Phone</label>
                                <span id="profilePhone">-</span>
                            </div>
                            <div class="profile-field">
                                <label>Joined</label>
                                <span id="profileJoined">-</span>
                            </div>
                            <div class="profile-field">
                                <label>Status</label>
                                <span class="badge badge-approved">Active</span>
                            </div>
                        </div>
                    </div>

                    <div class="mt-4">
                        <h4 class="mb-3">Bio</h4>
                        <p id="profileBio" class="text-gray">No bio added yet.</p>
                    </div>

                    <div class="mt-4">
                        <h4 class="mb-3">Certificates</h4>
                        <div id="profileCerts">
                            <p class="text-gray">No certificates uploaded.</p>
                        </div>
                    </div>

                    <div class="mt-4 text-center">
                        <button class="btn btn-primary" id="editProfileBtn">
                            <i class="bi bi-pencil"></i> Edit Profile
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Profile Modal -->
    <div class="modal-overlay" id="editProfileModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Edit Profile</h3>
                <button class="modal-close" id="closeEditModal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="editProfileForm">
                    <!-- Profile Image Change -->
                    <div class="form-group text-center">
                        <label class="profile-upload-label" for="editProfileImage">
                            <div class="profile-upload-circle edit-mode">
                                <i class="bi bi-person-circle profile-upload-icon"></i>
                                <img id="editProfilePreview" class="profile-upload-preview hidden" alt="Preview">
                            </div>
                            <span class="profile-upload-text">Change Profile Photo</span>
                        </label>
                        <input type="file" id="editProfileImage" accept="image/*" class="hidden">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="editName" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">School Staff ID</label>
                        <input type="text" class="form-control" id="editStaffId" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Phone</label>
                        <input type="tel" class="form-control" id="editPhone">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Bio</label>
                        <textarea class="form-control" id="editBio" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Upload Certificates</label>
                        <div class="cert-upload-area" id="certUploadArea">
                            <i class="bi bi-cloud-upload"></i>
                            <p>Click to upload or drag and drop</p>
                            <input type="file" id="certInput" multiple accept=".pdf,.doc,.docx,.jpg,.png" class="hidden">
                        </div>
                        <div class="cert-list" id="certList"></div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline-primary" id="cancelEdit">Cancel</button>
                <button class="btn btn-primary" id="saveProfile">Save Changes</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../Style&Functions/api.js"></script>
    <script src="../Style&Functions/App.js"></script>
    <script src="../Nav&Slide/nav.js"></script>
    <script src="profile.js"></script>
</body>
</html>
