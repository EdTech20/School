<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Leaderboard - Staff Appraisal System</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"><link rel="stylesheet" href="../Style&Functions/styles.css"></head><body>
<div class="main-content"><div class="content-wrapper"><div class="card"><div class="card-header"><h3 class="card-title">Performance Leaderboard</h3><div class="filter-bar"><select class="form-select" id="leaderboardSession"></select><select class="form-select" id="leaderboardFilter"><option value="">All Departments</option></select></div></div><div class="card-body"><div id="leaderboardContainer"></div><div id="leaderboardEmpty" class="empty-state hidden"><i class="bi bi-trophy"></i><h3>No Evaluations Yet</h3><p>No completed evaluations exist for this session.</p></div></div></div></div></div>
<div class="modal-overlay" id="leaderboardPreviewModal"><div class="modal-content wide-preview-modal"><div class="modal-header"><h3 class="modal-title" id="leaderboardPreviewTitle">Evaluation Preview</h3><button class="modal-close" id="closeLeaderboardPreview">&times;</button></div><div class="modal-body" id="leaderboardPreviewBody"></div></div></div>
<div class="modal-overlay" id="documentPreviewModal"><div class="modal-content document-preview-modal"><div class="modal-header"><h3 class="modal-title" id="documentPreviewTitle">Document Preview</h3><button class="modal-close" onclick="document.getElementById('documentPreviewModal').classList.remove('active')">&times;</button></div><div class="modal-body" id="documentPreviewBody"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script><script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script><script src="../Style&Functions/api.js"></script><script src="../Style&Functions/App.js"></script><script src="../Nav&Slide/nav.js"></script><script src="leaderboard.js"></script></body></html>
