<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluation - Staff Appraisal System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../Style&Functions/styles.css">
</head>
<body>
<div class="main-content"><div class="content-wrapper">
    <div id="evaluationSessionState"></div>
    <div class="card">
        <div class="card-header"><h3 class="card-title">Staff Evaluation</h3><div class="filter-bar"><div class="input-group"><span class="input-group-text"><i class="bi bi-search"></i></span><input class="form-control" id="evalSearch" placeholder="Search lecturer..."></div></div></div>
        <div class="card-body"><div class="table-container"><table class="data-table"><thead><tr><th>Lecturer</th><th>Staff ID</th><th>Department</th><th>Last Evaluation</th><th>Status</th><th>Action</th></tr></thead><tbody id="evalTableBody"></tbody></table></div></div>
    </div>
</div></div>
<div class="modal-overlay" id="evalModal"><div class="modal-content eval-modal">
    <div class="modal-header"><div><h3 class="modal-title">Evaluate Staff</h3><p class="text-gray mb-0" id="evalStaffDept"></p></div><button class="modal-close" id="closeEvalModal">&times;</button></div>
    <div class="modal-body"><h5 id="evalStaffName" class="mb-3"></h5>
        <form id="evaluationForm">
            <div class="eval-section"><div class="eval-section-title">Student Evaluation Results</div>
            <div class="mt-3 p-3 score-summary"><div class="d-flex justify-content-between align-center"><strong>Average Student Score</strong><strong id="totalScoreDisplay" class="score-display text-primary">0%</strong></div><div class="progress mt-2"><div class="progress-bar" id="scoreProgress" style="width:0%"></div></div></div></div>
            <div class="form-group mt-4"><label class="form-label">Recommendation to VC</label><select class="form-control form-select" id="hodRecommendation" required><option value="">Select Recommendation</option><option value="Recommend for promotion to the VC">Recommend for promotion to the VC</option><option value="Issue a strong warning">Issue a strong warning</option></select></div>
            <div class="form-group mt-3"><label class="form-label">Review Comments</label><textarea class="form-control" id="evalComments" rows="3" placeholder="Enter your review and remarks..."></textarea></div>
        </form>
    </div>
    <div class="modal-footer"><button class="btn btn-outline-primary" id="cancelEval">Cancel</button><button class="btn btn-primary" id="submitEval">Submit Evaluation</button></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script><script src="../Style&Functions/api.js"></script><script src="../Style&Functions/App.js"></script><script src="../Nav&Slide/nav.js"></script><script src="evaluation.js"></script>
</body></html>
