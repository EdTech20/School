<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Applications - Staff Appraisal System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../Style&Functions/styles.css">
</head>
<body>
    <div class="main-content">
        <div class="content-wrapper">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Staff Applications</h3>
                    <div class="filter-bar">
                        <div class="input-group" style="width: 220px;">
                            <span class="input-group-text"><i class="bi bi-search"></i></span>
                            <input type="text" class="form-control" id="appsSearch" placeholder="Search applicant...">
                        </div>
                        <select class="form-select" id="statusFilter" style="width: 150px;">
                            <option value="">All Status</option>
                            <option value="Pending">Pending</option>
                            <option value="Approved">Approved</option>
                            <option value="Rejected">Rejected</option>
                        </select>
                        <select class="form-select" id="typeFilter" style="width: 180px;">
                            <option value="">All Types</option>
                            <option value="Promotion">Promotion</option>
                            <option value="Annual Review">Annual Review</option>
                            <option value="Contract Renewal">Contract Renewal</option>
                            <option value="Sabbatical">Sabbatical</option>
                        </select>
                    </div>
                </div>
                <div class="card-body">
                    <div class="table-container">
                        <table class="data-table" id="appsTable">
                            <thead>
                                <tr>
                                    <th>Applicant</th>
                                    <th>Department</th>
                                    <th>Session</th>
                                    <th>Application Type</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="appsTableBody">
                                <!-- Injected by JS -->
                            </tbody>
                        </table>
                    </div>
                    <div id="appsEmpty" class="empty-state hidden">
                        <i class="bi bi-inbox"></i>
                        <h3>No Applications</h3>
                        <p>No staff applications found.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- View Application Modal -->
    <div class="modal-overlay" id="viewAppModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Application Details</h3>
                <button class="modal-close" id="closeViewModal">&times;</button>
            </div>
            <div class="modal-body" id="appDetailsBody">
                <!-- Injected by JS -->
            </div>
            <div class="modal-footer" id="appActionsFooter">
                <!-- Injected by JS -->
            </div>
        </div>
    </div>

    <!-- Certificate Preview Modal -->
    <div class="modal-overlay" id="certPreviewModal">
        <div class="modal-content cert-preview-modal">
            <div class="modal-header">
                <h3 class="modal-title" id="certPreviewTitle">Certificate Preview</h3>
                <button class="modal-close" id="closeCertPreview">&times;</button>
            </div>
            <div class="modal-body cert-preview-body" id="certPreviewBody">
                <!-- Injected by JS -->
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline-primary" id="closeCertPreviewBtn">Close</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
    <script src="../Style&Functions/api.js"></script>
    <script src="../Style&Functions/App.js"></script>
    <script src="../Nav&Slide/nav.js"></script>
    <script src="staff-applications.js"></script>
</body>
</html>
