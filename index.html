<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Appraisal & Evaluation System - Login</title>
    <meta name="description" content="Staff Appraisal & Evaluation System - Securely login to manage staff performance appraisals, evaluations, and leaderboard rankings.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="Style&Functions/styles.css">
</head>
<body class="auth-page">

    <div class="auth-card">
        <div class="auth-logo">
            <i class="bi bi-mortarboard-fill"></i>
            <h2>Staff Appraisal</h2>
            <p>Sign in to your account</p>
        </div>

        <div id="authAlert" class="alert hidden" role="alert">
            <i class="bi bi-exclamation-triangle"></i>
            <span></span>
        </div>

        <form class="auth-form" id="loginForm" novalidate>
            <div class="form-group">
                <label for="loginEmail">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control" id="loginEmail" placeholder="Enter your email" required autocomplete="email">
                </div>
            </div>

            <div class="form-group">
                <label for="loginPassword">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="loginPassword" placeholder="Enter your password" required autocomplete="current-password">
                    <span class="input-group-text password-toggle" id="togglePassword" role="button" aria-label="Toggle password visibility">
                        <i class="bi bi-eye"></i>
                    </span>
                </div>
            </div>

            <div class="form-group d-flex justify-content-end">
                <a href="LOGINS/forgot-password.html" class="text-link">
                    <i class="bi bi-question-circle"></i> Forgot Password?
                </a>
            </div>

            <button type="submit" class="auth-btn" id="loginBtn">
                <i class="bi bi-box-arrow-in-right"></i> Sign In
            </button>
        </form>

        <div class="auth-footer">
            <p>Don't have an account? <a href="LOGINS/signup.html">Create Account</a></p>
        </div>

        <!-- Demo Credentials Info -->
        <div class="demo-creds" style="margin-top:1rem; padding:0.75rem 1rem; background:rgba(99,102,241,0.08); border-radius:0.75rem; border:1px solid rgba(99,102,241,0.2);">
            <p style="font-size:0.75rem; color:var(--text-secondary); margin-bottom:0.4rem; font-weight:600; text-transform:uppercase; letter-spacing:0.05em;">
                <i class="bi bi-info-circle"></i> Demo Accounts
            </p>
            <div style="font-size:0.72rem; color:var(--text-secondary); line-height:1.8;">
                <div><strong>VC:</strong> vc@university.edu / vc123456</div>
                <div><strong>HOD:</strong> hod@university.edu / hod123456</div>
                <div><strong>Lecturer:</strong> lecturer@university.edu / lec123456</div>
                <div><strong>Student:</strong> student@university.edu / stu123456</div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="Style&Functions/api.js"></script>
    <script src="Style&Functions/App.js"></script>
    <script src="LOGINS/auth.js"></script>
</body>
</html>
